<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCB Digibank - Đổi mật khẩu</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background"></div>

    <!-- Thông báo -->
    <div class="toast" id="toast">
        <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
        <span class="toast-message" id="toastMessage">Thông báo</span>
    </div>

    <div class="auth-container">
        <h1 class="title">VCB<span style="font-weight: normal;">Digibank</span></h1>
        <p class="subtitle">Đổi mật khẩu tài khoản</p>

        <!-- Form Đổi mật khẩu -->
        <form id="changePasswordForm" class="auth-form">
            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-lock"></i></span>
                    <input type="password" placeholder="Mật khẩu cũ" id="oldPassword" required>
                    <span class="input-icon" onclick="togglePassword('oldPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-lock"></i></span>
                    <input type="password" placeholder="Mật khẩu mới" id="newPassword" required minlength="6">
                    <span class="input-icon" onclick="togglePassword('newPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-lock"></i></span>
                    <input type="password" placeholder="Xác nhận mật khẩu mới" id="confirmNewPassword" required>
                    <span class="input-icon" onclick="togglePassword('confirmNewPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-key"></i> Đổi mật khẩu
            </button>

            <div class="switch-form">
                <a href="index.html">← Quay lại đăng nhập</a>
            </div>
        </form>
    </div>

    <script src="../js/index.js"></script>
    <script>
        // Xử lý đổi mật khẩu
        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            
            // Kiểm tra xác nhận mật khẩu
            if (newPassword !== confirmNewPassword) {
                showToast('Mật khẩu xác nhận không khớp', 'error');
                return;
            }
            
            // Kiểm tra độ dài mật khẩu mới
            if (newPassword.length < 6) {
                showToast('Mật khẩu mới phải có ít nhất 6 ký tự', 'error');
                return;
            }
            
            // Gọi API đổi mật khẩu
            const submitBtn = document.querySelector('#changePasswordForm .submit-btn');
            submitBtn.classList.add('loading');
            
            callChangePasswordAPI({
                oldPass: oldPassword,
                newPass: newPassword
            })
            .finally(() => {
                submitBtn.classList.remove('loading');
            });
        });

        // Hàm gọi API đổi mật khẩu
        async function callChangePasswordAPI(data) {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}` // Gửi token xác thực
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showToast(result.thongBao || 'Đổi mật khẩu thành công!', 'success');
                    
                    // Quay lại trang đăng nhập sau 2 giây
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showToast(result.thongBao || 'Đổi mật khẩu thất bại', 'error');
                }
            } catch (error) {
                console.error('Change password error:', error);
                showToast('Lỗi kết nối server', 'error');
            }
        }
    </script>
</body>
</html>
