<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Cá Nhân</title>
    <link rel="stylesheet" href="../css/customer-profile.css">
</head>
<body>
    <div class="container">
        <h1>Thông Tin Cá Nhân</h1>
        
        <div id="thongBao" class="thong-bao"></div>
        
        <div id="profileContent" class="profile-content">
            <div class="info-row">
                <label>Họ và tên:</label>
                <span id="hoTen">---</span>
            </div>
            
            <div class="info-row">
                <label>Email:</label>
                <span id="email">---</span>
            </div>
            
            <div class="info-row">
                <label>Số điện thoại:</label>
                <span id="soDienThoai">---</span>
            </div>
            
            <div class="info-row">
                <label>Địa chỉ:</label>
                <span id="diaChi">---</span>
            </div>
            
            <div class="info-row">
                <label>Trạng thái KYC:</label>
                <span id="trangThaiKyc" class="kyc-status">---</span>
            </div>
        </div>
        
        <div class="actions">
            <button onclick="quayLai()" class="btn-secondary">Quay lại</button>
            <button onclick="chuyenDenKyc()" class="btn-primary">Gửi xác minh KYC</button>
        </div>
    </div>
    
    <script src="../js/customer-profile.js"></script>
</body>
</html>
