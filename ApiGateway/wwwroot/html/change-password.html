<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCB Digibank - Đổi mật khẩu</title>
    <link rel="stylesheet" href="../css/customer-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>VCB<span>Digibank</span></h1>
            </div>
            <div class="user-info">
                <span class="welcome">Xin chào, <strong id="userName">Khách hàng</strong></span>
                <button onclick="dangXuat()" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </div>
        </header>

        <!-- Menu điều hướng -->
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i> Trang chủ
            </a>
            <a href="transfer.html" class="nav-item">
                <i class="fas fa-exchange-alt"></i> Chuyển tiền
            </a>
            <a href="transaction-history.html" class="nav-item">
                <i class="fas fa-history"></i> Lịch sử GD
            </a>
            <a href="customer-profile.html" class="nav-item">
                <i class="fas fa-user"></i> Thông tin cá nhân
            </a>
            <a href="change-password.html" class="nav-item active">
                <i class="fas fa-key"></i> Đổi mật khẩu
            </a>
        </nav>

        <!-- Nội dung chính -->
        <main class="main-content">
            <h2>Đổi mật khẩu</h2>
            
            <div id="thongBao" class="thong-bao"></div>
            
            <div class="cards">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-key"></i>
                        <h3>Thay đổi mật khẩu tài khoản</h3>
                    </div>
                    <div class="card-body">
                        <form id="changePasswordForm" class="kyc-form">
                            <div class="form-group">
                                <label for="oldPassword">Mật khẩu cũ: <span class="required">*</span></label>
                                <input type="password" id="oldPassword" placeholder="Nhập mật khẩu cũ" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="newPassword">Mật khẩu mới: <span class="required">*</span></label>
                                <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required minlength="6">
                                <small>Mật khẩu phải có ít nhất 6 ký tự</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="confirmNewPassword">Xác nhận mật khẩu mới: <span class="required">*</span></label>
                                <input type="password" id="confirmNewPassword" placeholder="Nhập lại mật khẩu mới" required>
                            </div>
                            
                            <div class="actions">
                                <button type="submit" class="btn-primary">
                                    <i class="fas fa-key"></i> Đổi mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 VCB Digibank - Ngân hàng trực tuyến</p>
        </footer>
    </div>
    
    <script src="../js/change-password.js" defer></script>
</body>
</html>
