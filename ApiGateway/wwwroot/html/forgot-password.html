<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCB Digibank - Quên mật khẩu</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            gap: 10px;
        }
        .step {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .step.active {
            background: linear-gradient(135deg, #28a745, #20c997);
            box-shadow: 0 3px 15px rgba(40, 167, 69, 0.5);
        }
        .step.completed {
            background: #28a745;
        }
        .step-line {
            width: 50px;
            height: 3px;
            background: rgba(255,255,255,0.2);
            align-self: center;
        }
        .step-line.completed {
            background: #28a745;
        }
        .form-step {
            display: none;
        }
        .form-step.active {
            display: block;
        }
        .token-display {
            background: rgba(255,255,255,0.15);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
        }
        .token-display .token-value {
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
            letter-spacing: 5px;
            margin: 10px 0;
        }
        .token-display .token-note {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .success-message {
            text-align: center;
            padding: 30px 20px;
        }
        .success-message i {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }
        .success-message h3 {
            color: white;
            margin-bottom: 10px;
        }
        .success-message p {
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- Thông báo -->
    <div class="toast" id="toast">
        <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
        <span class="toast-message" id="toastMessage">Thông báo</span>
    </div>

    <div class="auth-container">
        <h1 class="title">VCB<span style="font-weight: normal;">Digibank</span></h1>
        <p class="subtitle">Quên mật khẩu</p>

        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step active" id="step1Indicator">1</div>
            <div class="step-line" id="line1"></div>
            <div class="step" id="step2Indicator">2</div>
            <div class="step-line" id="line2"></div>
            <div class="step" id="step3Indicator">3</div>
        </div>

        <!-- Step 1: Nhập tên đăng nhập -->
        <form id="step1Form" class="auth-form form-step active">
            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-user"></i></span>
                    <input type="text" placeholder="Nhập tên đăng nhập" id="tenDangNhap" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-arrow-right"></i> Tiếp tục
            </button>

            <div class="switch-form">
                <a href="../index.html"><i class="fas fa-arrow-left"></i> Quay lại đăng nhập</a>
            </div>
        </form>

        <!-- Step 2: Hiển thị token (demo) và nhập token xác nhận -->
        <form id="step2Form" class="auth-form form-step">
            <div class="token-display">
                <div class="token-note">Mã xác nhận của bạn (demo):</div>
                <div class="token-value" id="tokenDisplay">------</div>
                <div class="token-note">Mã có hiệu lực trong 10 phút</div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-key"></i></span>
                    <input type="text" placeholder="Nhập mã xác nhận" id="tokenInput" required maxlength="6">
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-check"></i> Xác nhận
            </button>

            <div class="switch-form">
                <a href="#" onclick="goToStep(1); return false;"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>
        </form>

        <!-- Step 3: Nhập mật khẩu mới -->
        <form id="step3Form" class="auth-form form-step">
            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-lock"></i></span>
                    <input type="password" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" id="matKhauMoi" required minlength="6">
                    <span class="input-icon" onclick="togglePassword('matKhauMoi', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <span class="input-icon-left"><i class="fas fa-lock"></i></span>
                    <input type="password" placeholder="Nhập lại mật khẩu mới" id="nhapLaiMatKhauMoi" required>
                    <span class="input-icon" onclick="togglePassword('nhapLaiMatKhauMoi', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-save"></i> Đặt lại mật khẩu
            </button>

            <div class="switch-form">
                <a href="#" onclick="goToStep(2); return false;"><i class="fas fa-arrow-left"></i> Quay lại</a>
            </div>
        </form>

        <!-- Success Message -->
        <div id="successMessage" class="form-step success-message">
            <i class="fas fa-check-circle"></i>
            <h3>Đặt lại mật khẩu thành công!</h3>
            <p>Bạn có thể đăng nhập bằng mật khẩu mới.</p>
            <a href="../index.html" class="submit-btn" style="display: inline-block; text-decoration: none;">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập ngay
            </a>
        </div>
    </div>

    <script src="../js/forgot-password.js" defer></script>
</body>
</html>
