<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCB Admin - Đổi mật khẩu</title>
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .change-password-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #1a5f3c, #2ecc71);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .form-header i {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .form-header h2 {
            margin: 0;
            font-size: 24px;
        }
        .form-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        .form-group label .required {
            color: #e74c3c;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1a5f3c;
        }
        .input-wrapper .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        .input-wrapper .toggle-password:hover {
            color: #1a5f3c;
        }
        .form-group small {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a5f3c, #2ecc71);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 95, 60, 0.3);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1a5f3c;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Toast notification -->
    <div class="toast" id="toast">
        <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
        <span class="toast-message" id="toastMessage">Thông báo</span>
    </div>

    <!-- Header -->
    <header class="header">
        <h1>VCB<span>Admin</span></h1>
        <div class="user-info">
            <span>Xin chào, <strong id="fullName">Admin</strong></span>
            <button id="logoutBtn" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Đăng xuất
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <div class="change-password-container">
            <div class="form-header">
                <i class="fas fa-key"></i>
                <h2>Đổi mật khẩu</h2>
            </div>
            <div class="form-body">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="oldPassword">Mật khẩu hiện tại <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="oldPassword" placeholder="Nhập mật khẩu hiện tại" required>
                            <span class="toggle-password" onclick="togglePassword('oldPassword', this)">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">Mật khẩu mới <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" required minlength="6">
                            <span class="toggle-password" onclick="togglePassword('newPassword', this)">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        <small>Mật khẩu phải có ít nhất 6 ký tự</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Nhập lại mật khẩu mới <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required>
                            <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='admin-dashboard.html'">
                            <i class="fas fa-arrow-left"></i> Quay lại
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        const token = localStorage.getItem('token');

        // Check auth
        if (!token) {
            window.location.href = '../index.html';
        }

        // Load user info
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            document.getElementById('fullName').textContent = payload.TenDangNhap || 'Admin';
        } catch (e) {
            console.error('Error parsing token:', e);
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = toast.querySelector('.toast-icon i');
            
            toastMessage.textContent = message;
            toast.classList.remove('error', 'warning');
            
            if (type === 'error') {
                toast.classList.add('error');
                toastIcon.className = 'fas fa-times-circle';
            } else if (type === 'warning') {
                toast.classList.add('warning');
                toastIcon.className = 'fas fa-exclamation-circle';
            } else {
                toastIcon.className = 'fas fa-check-circle';
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Toggle password visibility
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            const icon = iconElement.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '../index.html';
        });

        // Change password form
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate
            if (newPassword.length < 6) {
                showToast('Mật khẩu mới phải có ít nhất 6 ký tự!', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Mật khẩu nhập lại không khớp!', 'error');
                return;
            }

            const submitBtn = e.target.querySelector('.btn-primary');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';

            try {
                const response = await fetch(`${API_URL}/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        matKhauCu: oldPassword,
                        matKhauMoi: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(data.thongBao || 'Đổi mật khẩu thành công!', 'success');
                    // Clear form
                    document.getElementById('changePasswordForm').reset();
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 2000);
                } else {
                    showToast(data.thongBao || 'Đổi mật khẩu thất bại!', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Lỗi kết nối server!', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Lưu thay đổi';
            }
        });
    </script>
</body>
</html>
